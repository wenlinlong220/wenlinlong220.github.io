<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频测试</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
        }
        .video-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        video {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .info {
            background: rgba(0,212,255,0.1);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <h1>智能车视频背景测试</h1>
        <p>原始视频: smart-car-background.mp4 (77MB)</p>
        <video controls>
            <source src="/videos/smart-car-background.mp4" type="video/mp4">
            您的浏览器不支持视频标签。
        </video>
        
        <p>优化后视频: smart-car-optimized.mp4 (4MB)</p>
        <video controls autoplay muted loop>
            <source src="/videos/smart-car-optimized.mp4" type="video/mp4">
            您的浏览器不支持视频标签。
        </video>
        
        <div class="info">
            <h3>视频信息:</h3>
            <p><strong>原始视频:</strong> 77MB, 1080x1208, H.264, 30fps</p>
            <p><strong>优化视频:</strong> 4MB, 720x806, H.264, 30fps, CRF 28</p>
            <p><strong>优化效果:</strong> 文件大小减少95%，质量保持良好</p>
        </div>
    </div>
</body>
</html>

{{ define "main" }}
<div class="about-container">
    <article class="about-content">
        <div class="terminal-header">
            <div class="terminal-buttons">
                <span class="btn-close"></span>
                <span class="btn-minimize"></span>
                <span class="btn-maximize"></span>
            </div>
            <div class="terminal-title">404.md</div>
        </div>
        <div class="terminal-body">
            <div class="prompt-line">
                <span class="prompt">$</span>
                <span class="command">cat 404.md</span>
            </div>
            <div class="error-content">
                <h1 class="error-code">404</h1>
                <h2 class="error-title">Page Not Found</h2>
                <p class="error-message">
                    The page you're looking for doesn't exist or has been moved.
                </p>
                
                <div class="prompt-line">
                    <span class="prompt">$</span>
                    <span class="command">ls -la /</span>
                </div>
                
                <div class="file-listing" style="margin: 1rem 0 2rem 0;">
                    <div class="file-item">
                        <span>📁</span>
                        <a href="{{ .Site.BaseURL }}" class="file-name">home/</a>
                    </div>
                    <div class="file-item">
                        <span>📁</span>
                        <a href="{{ .Site.BaseURL }}posts/" class="file-name">blog/</a>
                    </div>
                    <div class="file-item">
                        <span>📁</span>
                        <a href="{{ .Site.BaseURL }}about/" class="file-name">about/</a>
                    </div>
                    <div class="file-item">
                        <span>📁</span>
                        <a href="{{ .Site.BaseURL }}social/" class="file-name">social/</a>
                    </div>
                </div>
                
                <div style="text-align: center;">
                    <a href="{{ .Site.BaseURL }}" class="btn btn-primary" style="margin-right: 1rem;">Go Home</a>
                    <a href="{{ .Site.BaseURL }}posts/" class="btn btn-secondary">Browse Blog</a>
                </div>
            </div>
        </div>
    </article>
</div>
{{ end }}

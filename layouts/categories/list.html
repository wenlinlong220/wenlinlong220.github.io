{{ define "main" }}
<div class="page-header">
    <div class="page-header-inner">
        <h1 class="page-title">{{ i18n "all_categories" }}</h1>
        
        <div class="social-grid">
            {{ range .Data.Terms }}
            <div class="social-card">
                <h3>{{ .Page.Title }}</h3>
                <p style="opacity: 0.8; margin-bottom: 1rem;">{{ .Count }} {{ i18n "posts_count" }}</p>
                <a href="{{ .Page.Permalink }}" class="btn btn-primary">{{ i18n "view_posts" }}</a>
            </div>
            {{ end }}
        </div>
    </div>
</div>
{{ end }}

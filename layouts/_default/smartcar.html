{{ define "main" }}
<div class="smartcar-container">
    <!-- 视频背景 -->
    <div class="video-background">
        <video autoplay muted loop playsinline preload="auto" poster="/videos/smart-car-poster.jpg" class="debug-video">
            <source src="/videos/smart-car-fixed.mp4" type="video/mp4">
            您的浏览器不支持视频标签。
        </video>
        <div class="video-overlay"></div>
    </div>

    <!-- 项目内容 -->
    <article class="smartcar-content">
        <div class="terminal-header">
            <div class="terminal-buttons">
                <span class="btn-close"></span>
                <span class="btn-minimize"></span>
                <span class="btn-maximize"></span>
            </div>
            <div class="terminal-title">{{ .Title }}.md</div>
        </div>
        
        <div class="terminal-body">
            <div class="prompt-line">
                <span class="prompt">$</span>
                <span class="command">cat {{ .Title | lower }}.md</span>
            </div>
            
            <div class="content">
                <h1>{{ .Title }}</h1>
                
                {{ if .Params.tech_stack }}
                <div class="tech-stack">
                    <h3>技术栈</h3>
                    <div class="tech-tags">
                        {{ range .Params.tech_stack }}
                        <span class="tech-tag">{{ . }}</span>
                        {{ end }}
                    </div>
                </div>
                {{ end }}
                
                {{ .Content }}
                
                {{ if .Params.links }}
                <div class="project-links">
                    {{ range .Params.links }}
                    <a href="{{ .url }}" class="project-link" target="_blank">
                        <span>{{ .icon }}</span>
                        {{ .name }}
                    </a>
                    {{ end }}
                </div>
                {{ end }}
            </div>
        </div>
    </article>
</div>

<style>
.smartcar-container {
    margin-top: 5rem;
    padding: 2rem;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
    position: relative;
    z-index: 1;
}

/* 视频背景样式 */
.video-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -9999;
    overflow: hidden;
}

.video-background video {
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
    /* filter: brightness(0.4) contrast(1.2); */
    background: #000;
}

.debug-video {
    border: 2px solid red !important;
}

.video-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        to bottom,
        rgba(10, 10, 10, 0.8) 0%,
        rgba(26, 26, 46, 0.7) 50%,
        rgba(10, 10, 10, 0.9) 100%
    );
}

/* 内容容器样式 */
.smartcar-content {
    background: rgba(26, 26, 46, 0.85);
    border-radius: 15px;
    padding: 0;
    border: 1px solid rgba(0, 212, 255, 0.3);
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    position: relative;
    z-index: 2;
    overflow: hidden;
}

.terminal-header {
    background: #16213e;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid rgba(0, 212, 255, 0.1);
}

.terminal-buttons {
    display: flex;
    gap: 8px;
    margin-right: 15px;
}

.terminal-buttons span {
    width: 12px;
    height: 12px;
    border-radius: 50%;
}

.btn-close { background: #ff5f57; }
.btn-minimize { background: #ffbd2e; }
.btn-maximize { background: #28ca42; }

.terminal-title {
    color: #888;
    font-family: 'Source Code Pro', Monaco, Menlo, monospace;
    font-size: 0.9rem;
    font-weight: 500;
}

.terminal-body {
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    line-height: 1.6;
    color: var(--text-primary);
    font-weight: 500;
}

.prompt-line {
    margin: 1.5rem 0 1rem;
    display: flex;
    align-items: center;
    gap: 10px;
}

.prompt {
    color: #00d4ff;
    font-weight: 700;
}

.command {
    color: #9d50bb;
    font-weight: 700;
}

.content {
    color: #e0e0e0;
    margin: 1rem 0;
}

.content h1 {
    color: #00d4ff;
    font-size: 1.8rem;
    margin-bottom: 1rem;
    font-family: inherit;
}

.content h2 {
    color: #ff6b6b;
    font-size: 1.3rem;
    margin: 1.5rem 0 0.8rem;
    font-family: inherit;
}

.content h3 {
    color: #00d4ff;
    font-size: 1.1rem;
    margin: 1.2rem 0 0.6rem;
    font-family: inherit;
}

.content p {
    margin-bottom: 1rem;
}

.content strong {
    color: #00d4ff;
}

/* 技术栈样式 */
.tech-stack {
    margin: 1.5rem 0;
    padding: 1rem;
    background: rgba(0, 212, 255, 0.1);
    border-radius: 8px;
    border: 1px solid rgba(0, 212, 255, 0.2);
}

.tech-stack h3 {
    color: #00d4ff;
    margin-bottom: 0.8rem;
    font-size: 1.1rem;
}

.tech-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
}

.tech-tag {
    background: rgba(0, 212, 255, 0.25);
    color: #00d4ff;
    padding: 6px 12px;
    border-radius: 15px;
    font-size: 0.85rem;
    border: 1px solid rgba(0, 212, 255, 0.3);
    transition: all 0.3s ease;
}

.tech-tag:hover {
    background: rgba(0, 212, 255, 0.4);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0, 212, 255, 0.2);
}

/* 列表样式 */
.content ul, .content ol {
    margin: 1rem 0;
    padding-left: 2rem;
}

.content li {
    margin-bottom: 0.5rem;
}

.content li:last-child {
    margin-bottom: 0;
}

/* 分隔线样式 */
.content hr {
    border: none;
    height: 1px;
    background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(255, 107, 107, 0.3) 20%, 
        rgba(255, 107, 107, 0.6) 50%, 
        rgba(255, 107, 107, 0.3) 80%, 
        transparent 100%);
    margin: 2.5rem 0;
}

/* 链接样式 */
.content a {
    color: #4dc3ff;
    text-decoration: none;
    transition: all 0.3s ease;
    border-bottom: 1px solid rgba(77, 195, 255, 0.3);
    padding-bottom: 1px;
}

.content a:hover {
    color: #80d4ff;
    border-bottom-color: #80d4ff;
    text-decoration: none;
}

.content a[href$=".pdf"] {
    color: #9d50bb;
    border-bottom-color: rgba(157, 80, 187, 0.3);
}

.content a[href$=".pdf"]:hover {
    color: #c27fe0;
    border-bottom-color: #c27fe0;
}

.content a + span {
    color: #888;
    font-size: 0.9rem;
    margin-left: 0.5rem;
    font-style: italic;
}

/* 项目链接样式 */
.project-links {
    display: flex;
    gap: 1rem;
    margin: 2rem 0;
    flex-wrap: wrap;
}

.project-link {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 10px 20px;
    background: linear-gradient(135deg, rgba(255, 107, 107, 0.2), rgba(0, 212, 255, 0.2));
    color: #ff6b6b;
    text-decoration: none;
    border-radius: 25px;
    transition: all 0.3s ease;
    border: 1px solid rgba(255, 107, 107, 0.3);
}

.project-link:hover {
    background: linear-gradient(135deg, rgba(255, 107, 107, 0.3), rgba(0, 212, 255, 0.3));
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(255, 107, 107, 0.2);
    color: #ff8b8b;
}

@media (max-width: 768px) {
    .smartcar-container {
        padding: 1rem;
        margin-top: 4rem;
    }
    
    .terminal-body {
        padding: 15px;
    }
    
    .video-background video {
        filter: brightness(0.3) contrast(1.2);
    }
    
    .tech-tags {
        justify-content: center;
    }
    
    .project-links {
        justify-content: center;
    }
}
</style>
{{ end }}

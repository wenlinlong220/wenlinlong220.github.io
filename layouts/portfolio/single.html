{{ define "main" }}
<div class="page-header">
    <div class="page-header-inner">
        <h1 class="page-title">{{ .Title }}</h1>
        <div class="page-description">{{ .Content }}</div>
        <div class="portfolio-grid">
            {{ range .Site.Params.portfolio }}
            <div class="portfolio-item">
                <div class="portfolio-image">{{ .icon }} {{ .type }}</div>
                <div class="portfolio-content">
                    <h3>{{ .title }}</h3>
                    <p>{{ .description }}</p>
                    <div class="project-card-tags" style="margin-top: 1rem;">
                        {{ range .tags }}
                        <span class="project-card-tag">{{ . }}</span>
                        {{ end }}
                    </div>
                    {{ if .project_url }}
                    <div style="margin-top: 1rem;">
                        <a href="{{ .project_url }}" class="btn btn-secondary">{{ i18n "view_details" }}</a>
                    </div>
                    {{ end }}
                </div>
            </div>
            {{ end }}
        </div>
    </div>
</div>
{{ end }}

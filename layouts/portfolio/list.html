{{ define "main" }}
<div style="margin-top: 5rem; padding: 2rem;">
    <div style="max-width: 1200px; margin: 0 auto;">
        <div style="text-align: center; margin-bottom: 3rem;">
            <h1 style="color: #00d4ff; font-size: 3rem; margin-bottom: 1rem;">{{ .Title }}</h1>
            <p style="font-size: 1.2rem; opacity: 0.9;">{{ .Content }}</p>
            
            <!-- 视图切换按钮 -->
            <div style="margin-top: 2rem; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                <a href="/portfolio/marquee/" class="btn" style="background: rgba(0, 212, 255, 0.2); color: #00d4ff; border: 1px solid rgba(0, 212, 255, 0.3); padding: 10px 20px; border-radius: 20px; text-decoration: none; transition: all 0.3s ease;">
                    <span>切换到跑马灯视图</span>
                </a>
                <a href="/" class="btn" style="background: rgba(157, 80, 187, 0.2); color: #9d50bb; border: 1px solid rgba(157, 80, 187, 0.3); padding: 10px 20px; border-radius: 20px; text-decoration: none; transition: all 0.3s ease;">
                    <span>返回首页</span>
                </a>
            </div>
        </div>
        <div class="portfolio-grid">
            {{ range .Site.Params.portfolio }}
            <div class="portfolio-item">
                <div class="portfolio-image">
                    {{ if .image }}
                    <img src="{{ .image }}" alt="{{ .title }}" loading="lazy" onerror="this.onerror=null; this.parentElement.innerHTML='{{ .icon }} {{ .type }}';">
                    {{ else }}
                    {{ .icon }} {{ .type }}
                    {{ end }}
                </div>
                <div class="portfolio-content">
                    <h3>{{ .title }}</h3>
                    <p>{{ .description }}</p>
                    <div style="margin-top: 1rem;">
                        {{ range .tags }}
                        <span style="background: rgba(0,212,255,0.2); padding: 4px 8px; border-radius: 15px; font-size: 0.8rem;">{{ . }}</span>
                        {{ end }}
                    </div>
                    {{ if .project_url }}
                    <div style="margin-top: 1rem;">
                        <a href="{{ .project_url }}" class="btn btn-secondary">View Details</a>
                    </div>
                    {{ end }}
                </div>
            </div>
            {{ end }}
        </div>
    </div>
</div>
{{ end }}

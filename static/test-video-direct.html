<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频直接测试</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .video-test {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            max-width: 600px;
            display: block;
            margin: 10px auto;
            border: 2px solid #00d4ff;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: rgba(40, 202, 66, 0.2); color: #28ca42; }
        .error { background: rgba(255, 95, 87, 0.2); color: #ff5f57; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>视频文件直接访问测试</h1>
        
        <div class="video-test">
            <h3>测试1: 无音频视频 (smart-car-noaudio.mp4)</h3>
            <video controls autoplay muted loop playsinline>
                <source src="/videos/smart-car-noaudio.mp4" type="video/mp4">
                您的浏览器不支持视频标签。
            </video>
            <div class="status" id="status1">等待加载...</div>
        </div>
        
        <div class="video-test">
            <h3>测试2: 优化视频 (smart-car-optimized.mp4)</h3>
            <video controls autoplay muted loop playsinline>
                <source src="/videos/smart-car-optimized.mp4" type="video/mp4">
                您的浏览器不支持视频标签。
            </video>
            <div class="status" id="status2">等待加载...</div>
        </div>
        
        <div class="video-test">
            <h3>测试3: 原始视频 (smart-car-background.mp4)</h3>
            <video controls>
                <source src="/videos/smart-car-background.mp4" type="video/mp4">
                您的浏览器不支持视频标签。
            </video>
            <div class="status" id="status3">等待加载...</div>
        </div>
        
        <div class="video-test">
            <h3>测试4: 海报图片</h3>
            <img src="/videos/smart-car-poster.jpg" alt="视频海报" style="width:100%;max-width:600px;display:block;margin:10px auto;">
            <div class="status" id="status4">图片应该显示</div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const videos = document.querySelectorAll('video');
            
            videos.forEach((video, index) => {
                video.addEventListener('loadeddata', function() {
                    document.getElementById(`status${index + 1}`).className = 'status success';
                    document.getElementById(`status${index + 1}`).textContent = '✓ 视频加载成功';
                });
                
                video.addEventListener('error', function() {
                    document.getElementById(`status${index + 1}`).className = 'status error';
                    document.getElementById(`status${index + 1}`).textContent = '✗ 视频加载失败';
                });
                
                video.addEventListener('playing', function() {
                    document.getElementById(`status${index + 1}`).textContent = '✓ 视频正在播放';
                });
            });
            
            // 检查图片
            const img = document.querySelector('img');
            img.addEventListener('load', function() {
                document.getElementById('status4').className = 'status success';
                document.getElementById('status4').textContent = '✓ 图片加载成功';
            });
            img.addEventListener('error', function() {
                document.getElementById('status4').className = 'status error';
                document.getElementById('status4').textContent = '✗ 图片加载失败';
            });
        });
    </script>
</body>
</html>

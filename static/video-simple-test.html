<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单视频测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .test-area {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 400px;
            margin: 20px 0;
            border: 3px solid #00d4ff;
            border-radius: 10px;
            overflow: hidden;
        }
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #4dc3ff;
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            background: rgba(255,255,255,0.1);
        }
        .log {
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="test-area">
        <h1>视频播放测试</h1>
        <p>测试文件: /videos/smart-car-fixed.mp4</p>
        
        <div class="video-wrapper">
            <video id="testVideo" autoplay muted loop playsinline>
                <source src="/videos/smart-car-fixed.mp4" type="video/mp4">
                您的浏览器不支持视频标签。
            </video>
        </div>
        
        <div class="controls">
            <button onclick="playVideo()">播放</button>
            <button onclick="pauseVideo()">暂停</button>
            <button onclick="toggleMute()">切换静音</button>
            <button onclick="reloadVideo()">重新加载</button>
            <button onclick="testOtherVideos()">测试其他视频</button>
        </div>
        
        <div class="status" id="status">
            状态: 初始化...
        </div>
        
        <div class="log" id="log">
            日志:<br>
        </div>
    </div>
    
    <script>
        const video = document.getElementById('testVideo');
        const statusEl = document.getElementById('status');
        const logEl = document.getElementById('log');
        
        function log(message) {
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `[${time}] ${message}<br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        function updateStatus(message) {
            statusEl.textContent = `状态: ${message}`;
            log(message);
        }
        
        // 视频事件监听
        video.addEventListener('loadeddata', () => {
            updateStatus('视频数据已加载');
        });
        
        video.addEventListener('canplay', () => {
            updateStatus('视频可以播放');
        });
        
        video.addEventListener('playing', () => {
            updateStatus('视频正在播放');
        });
        
        video.addEventListener('pause', () => {
            updateStatus('视频已暂停');
        });
        
        video.addEventListener('error', (e) => {
            updateStatus(`视频错误: ${video.error ? video.error.code : '未知错误'}`);
            console.error('Video error:', video.error);
        });
        
        video.addEventListener('waiting', () => {
            updateStatus('视频等待中...');
        });
        
        video.addEventListener('stalled', () => {
            updateStatus('视频加载停滞');
        });
        
        // 控制函数
        function playVideo() {
            video.play().then(() => {
                updateStatus('播放命令成功');
            }).catch(error => {
                updateStatus(`播放失败: ${error.message}`);
            });
        }
        
        function pauseVideo() {
            video.pause();
            updateStatus('已暂停');
        }
        
        function toggleMute() {
            video.muted = !video.muted;
            updateStatus(video.muted ? '已静音' : '取消静音');
        }
        
        function reloadVideo() {
            video.load();
            updateStatus('重新加载视频');
        }
        
        function testOtherVideos() {
            const videos = [
                '/videos/smart-car-noaudio.mp4',
                '/videos/smart-car-optimized.mp4',
                '/videos/smart-car-background.mp4'
            ];
            
            let index = 0;
            function testNext() {
                if (index >= videos.length) return;
                
                const src = videos[index];
                updateStatus(`测试: ${src}`);
                video.src = src;
                video.load();
                
                video.oncanplay = () => {
                    updateStatus(`可以播放: ${src}`);
                    video.play().then(() => {
                        updateStatus(`正在播放: ${src}`);
                        setTimeout(() => {
                            index++;
                            testNext();
                        }, 2000);
                    }).catch(error => {
                        updateStatus(`播放失败: ${src} - ${error.message}`);
                        index++;
                        testNext();
                    });
                };
                
                video.onerror = () => {
                    updateStatus(`加载失败: ${src}`);
                    index++;
                    testNext();
                };
            }
            
            testNext();
        }
        
        // 初始状态
        updateStatus('等待视频加载...');
        log('页面加载完成');
        log(`视频源: ${video.querySelector('source').src}`);
        log(`视频尺寸: ${video.videoWidth}x${video.videoHeight}`);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>最小视频测试</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 5px solid lime;
        }
        .debug {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: lime;
            padding: 10px;
            font-family: monospace;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <video id="video" autoplay muted loop playsinline>
        <source src="/videos/smart-car-fixed.mp4" type="video/mp4">
        您的浏览器不支持视频标签。
    </video>
    
    <div class="debug" id="debug">
        等待视频加载...
    </div>
    
    <script>
        const video = document.getElementById('video');
        const debug = document.getElementById('debug');
        
        function updateDebug(message) {
            debug.innerHTML = message;
            console.log(message);
        }
        
        video.addEventListener('loadeddata', () => {
            updateDebug(`视频已加载<br>尺寸: ${video.videoWidth}x${video.videoHeight}<br>时长: ${video.duration}s`);
        });
        
        video.addEventListener('playing', () => {
            updateDebug(`视频正在播放<br>当前时间: ${video.currentTime}s`);
        });
        
        video.addEventListener('error', () => {
            updateDebug(`视频错误: ${video.error ? video.error.code : '未知'}`);
        });
        
        video.addEventListener('waiting', () => {
            updateDebug('视频等待数据...');
        });
        
        // 尝试播放
        setTimeout(() => {
            video.play().then(() => {
                updateDebug('自动播放成功');
            }).catch(error => {
                updateDebug(`自动播放失败: ${error.message}`);
            });
        }, 1000);
    </script>
</body>
</html>
